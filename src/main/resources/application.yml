spring:
  application:
    name: fraud-detection-service
  datasource:
    url: jdbc:postgresql://localhost:5432/frauddb
    username: fraud_user
    password: fraud_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      compression-type: snappy
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: true
    consumer:
      group-id: fraud-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: com.frauddetection.model
        isolation.level: read_committed
    streams:
      application-id: fraud-detection-streams
      bootstrap-servers: localhost:9092
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        commit.interval.ms: 1000
        cache.max.bytes.buffering: 10485760
        num.stream.threads: 2
        replication.factor: 1
        state.dir: /tmp/kafka-streams

kafka:
  topic:
    transactions-raw: transactions-raw
    windowed-transactions: windowed-transactions
    fraud-alerts: fraud-alerts
    allowed-transactions: allowed-transactions

rule:
  reload:
    interval:
      ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,kafkastreams
  endpoint:
    health:
      show-details: always

server:
  port: 8080
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s

logging:
  level:
    com.frauddetection: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
